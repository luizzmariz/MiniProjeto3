<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalhes da Tarefa</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/detail.css"/>
  <script src="js/details.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">

    <div class="card shadow-sm p-4">
      <h2 id="titulo" class="mb-3">Título da Tarefa</h2>

      <p><strong>Data da Tarefa:</strong> <span id="taskDate"></span></p>
      <p><strong>Prioridade:</strong> <span id="priority" class="badge"></span></p>
      <p><strong>Comentário:</strong> <span id="comment"></span></p>
      <p><strong>Notificar:</strong> <span id="notification"></span></p>
      <p><strong>Criada em:</strong> <span id="createdAt"></span></p>
      <p><strong>Status:</strong> <span id="status" class="badge"></span></p>
    </div>
  </div>

</body>
</html>
