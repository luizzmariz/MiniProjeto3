<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniProjeto III</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/main.js"></script>
</head>

<body onload="start()">

  <div class="search-container">
    <div class="search-bar">
      <div class="input-group search-controls">
          <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-toggle="dropdown">
            Filtros
          </button>
          <div class="dropdown-menu dropdown-menu-right" id="filtroMenu">
            <a class="dropdown-item" href="#" onclick="ordenarTarefas('titulo')">Ordem alfabética</a>
            <a class="dropdown-item" href="#" onclick="ordenarTarefas('dataTarefa')">Data da tarefa</a>
            <a class="dropdown-item" href="#" onclick="ordenarTarefas('prioridade')">Prioridade</a>
            <a class="dropdown-item" href="#" onclick="ordenarTarefas('dataCriacao')">Data de criação</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container page-content">
    <h2>Lista de Tarefas</h2>

    <p class="mt-3 text-muted" id="noTasks">Não há tarefas cadastradas</p>

    <ul id="lista">
        <li id="0" class="list-group-item d-flex justify-content-between align-items-start flex-column flex-md-row">
            <div class="me-auto">
                <strong>titulo</strong> <br/>
                <small>Data da Tarefa</small><br/>
                <span>Prioridade</span>
            </div>
            <div class="mt-2 mt-md-0 d-flex gap-2">
                <button class="btn btn-sm btn-info" onclick="mostrarDetalhes(this)">Detalhes</button>
                <button class="btn btn-sm btn-warning" onclick="editarTarefa(this)">Editar</button>
                <button class="btn btn-sm btn-danger" onclick="removerTarefa(this)">Remover</button>
                <button class="btn btn-sm btn-secondary" onclick="abrirTarefa(this)">Abrir</button>
            </div>
            <div id="details" class="mt-2 text-muted d-none">
                <p id="createdAt">Criada em:</p> <br/>
                <p id="description">Comentário: </p>
            </div>
        </li>
    </ul>

    <form id="form" class="card p-3 mb-4 shadow-sm" name="Lista">
        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" id="title">
        </div>
        <div class="mb-3">
            <label class="form-label">Data da Tarefa</label>
            <input type="date" class="form-control" id="taskDate">
        </div>
        <div class="mb-3">
            <label class="form-label">Comentário</label>
            <textarea class="form-control" id="comment" rows="2"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Prioridade</label>
            <select class="form-select" id="priority">
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa">Baixa</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Notificação</label>
            <select class="form-select" id="notification">
                <option value="Sim">Sim</option>
                <option value="Não">Não</option>
            </select>
        </div>

        <button onclick="adicionarTarefa()" class="btn btn-primary" type="button">Adicionar Tarefa</button>
        <button onclick="resetarCadastro()" class="btn btn-secondary" type="button">Cancelar</button>
    </form>

    <div id="list-buttons">

      <button onclick="cadastrarTarefa()" type="button">Adicionar Nova Tarefa</button>
    </div>
  

  </div>

  
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
